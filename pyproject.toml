[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "inter-agent-security-proxy"
version = "0.1.0"
description = "Security proxy for agent-to-agent traffic: PII tokenisation, prompt-injection defence, least-privilege tool policy and a hash-chained audit log."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abhishek Kumar" }]
keywords = ["llm", "agents", "security", "prompt-injection", "pii", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
models = ["fastembed>=0.4"]
nlp = ["spacy>=3.7"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
]

[project.scripts]
agent-proxy = "agent_proxy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_proxy"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/agent_proxy/cli.py" = ["B008", "UP045"]
"src/agent_proxy/server.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "models: needs the fastembed embedding model or the spaCy model (skipped when unavailable)",
]

[tool.mypy]
python_version = "3.10"
files = ["src/agent_proxy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
